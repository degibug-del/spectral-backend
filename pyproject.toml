[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectral-backend"
version = "0.1.0"
description = "Spectral reasoning backend for phronesis.world"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "spacy>=3.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psycopg[binary]>=3.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.8",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
